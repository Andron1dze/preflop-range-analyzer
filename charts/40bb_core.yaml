#   4-бет 2.2x или олл-ин.
#
# ВНИМАНИЕ: частоты — приближение по общему знанию 40bb-стратегий, а НЕ выход HRC.
# Поэтому source: synthetic-test — набор грузится и проходит валидацию, но в
# пользовательский анализ не попадает. Чтобы использовать настоящие частоты,
# замените стратегии экспортом HRC (строки диапазонов → core.charts.importers.pio_range)
# и поставьте source: hrc-chipev-40bb-8max.
#
# Сгенерировано скриптом из строк диапазонов (pio_range.build_node).
